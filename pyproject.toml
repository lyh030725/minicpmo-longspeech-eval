[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minicpmo-longspeech-eval"
version = "0.1.0"
description = "MiniCPM-o 4.5 evaluation harness for the Marco-LongSpeech test set"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
